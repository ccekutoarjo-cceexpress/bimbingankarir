<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Karir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbyV6Nowlxv26_aF8rA421bgw8Xv4Gs9AikR0iakqqSUG4laZtbpqUEtKurRl3vsydhm/exec"
        allow="geolocation; microphone; camera; clipboard-write;"
        allowfullscreen>
    </iframe>
</body>
</html>
